[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsticker"
version = "0.1.0"
description = "Live sports scores on a 64x32 RGB LED matrix (Raspberry Pi + RGB Matrix Bonnet)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "Pillow>=9.4",
]

[project.optional-dependencies]
emulator = ["RGBMatrixEmulator>=0.11"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
sportsticker = "sportsticker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sportsticker = ["fonts/*.bdf", "fonts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
